jobs:
  build-backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./backend/DefectTracker.csproj

      - name: Build backend
        run: dotnet build ./backend/DefectTracker.csproj --no-restore --configuration Release

      - name: Run backend tests
        run: dotnet test ./backend/DefectTracker.csproj --no-build --verbosity normal
