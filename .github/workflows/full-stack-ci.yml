name: CI

on:
  pull_request:
    branches:
      - dev

jobs:
  build-backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # Будет установлена последняя 8.0.*, включая 8.0.400

      - name: Restore dependencies
        run: dotnet restore ./YourBackendProject.sln

      - name: Build backend
        run: dotnet build ./YourBackendProject.sln --no-restore --configuration Release

      - name: Run backend tests
        run: dotnet test ./YourBackendProject.sln --no-build --verbosity normal

  build-frontend:
    name: Build Vue.js Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.11.0'

      - name: Install frontend dependencies
        run: |
          cd frontend 
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build
